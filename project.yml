name: Days
options:
  bundleIdPrefix: com.daysapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Days:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: DaysWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daysapp.Days
        PRODUCT_NAME: Days
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Days
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        CODE_SIGN_ENTITLEMENTS: App/Days.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  DaysWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: App/Models.swift
    info:
      path: Support/DaysWidget-Info.plist
      properties:
        CFBundleDisplayName: DaysWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daysapp.Days.DaysWidget
        PRODUCT_NAME: DaysWidget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Widget/DaysWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

schemes:
  Days:
    build:
      targets:
        Days: all
        DaysWidget: all
    run:
      config: Debug
    archive:
      config: Release
