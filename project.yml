name: Days
options:
  bundleIdPrefix: com.daysapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES

targets:
  Days:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: DaysWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daysapp.Days
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Days
        CODE_SIGN_ENTITLEMENTS: App/Days.entitlements
        TARGETED_DEVICE_FAMILY: "1"

  DaysWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: App/Models.swift
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daysapp.Days.DaysWidget
        CODE_SIGN_ENTITLEMENTS: Widget/DaysWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Days:
    build:
      targets:
        Days: all
